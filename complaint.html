<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a Complaint</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.w{max-width:560px;margin:0 auto;padding:16px}
.c{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 12px}p.s{color:#64748b;margin:0 0 12px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{margin-top:16px;width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}.m{margin-top:12px;padding:10px;border-radius:8px;font-size:14px;display:none}
.ok{background:#dcfce7;color:#166534}.er{background:#fee2e2;color:#991b1b}
</style></head><body><div class="w">
<h1>Complaint Register</h1><p class="s">Tell us what went wrong. We will review it and get back to you.</p>
<div class="c"><h2>New complaint</h2>
<label>Full name *</label><input id="name">
<label>Phone number *</label><input id="phone" type="tel">
<label>Email (optional)</label><input id="email" type="email">
<label>Related department</label><select id="dept"></select>
<label>Subject *</label><input id="subject" maxlength="150">
<label>Details *</label><textarea id="message"></textarea>
<button id="go" onclick="send()">Submit complaint</button><div id="m1" class="m"></div></div>
<div class="c"><h2>Track your complaint</h2>
<label>Complaint ID</label><input id="tid" placeholder="C-261118-5">
<label>Phone number used</label><input id="tph" type="tel">
<button onclick="track()">Check status</button><div id="m2" class="m"></div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbzgXJCGskGFMne6rus0vJFtQtoGSbhgXooDZnUtl8dUhowebuv_zIlP4R-R72Kxn95c3A/exec';
const DEPTS=['Accounts','Operations','Customer Service','IT','Other'];
const $=i=>document.getElementById(i);
$('dept').innerHTML=DEPTS.map(d=>`<option>${d}</option>`).join('');
async function call(o){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)});
  const j=await r.json(); if(!j.ok)throw new Error(j.error); return j;
}
function msg(id,t,ok){const e=$(id);e.textContent=t;e.className='m '+(ok?'ok':'er');e.style.display='block';}
async function send(){
  const b=$('go');b.disabled=true;
  try{
    const j=await call({action:'submit',name:$('name').value,phone:$('phone').value,email:$('email').value,dept:$('dept').value,subject:$('subject').value,message:$('message').value});
    msg('m1','Submitted. Your complaint ID is '+j.id+'. Keep it to track your complaint.',true);
    ['name','phone','email','subject','message'].forEach(i=>$(i).value='');
  }catch(e){msg('m1',e.message,false);}
  b.disabled=false;
}
async function track(){
  try{
    const j=await call({action:'track',id:$('tid').value,phone:$('tph').value});
    msg('m2','Status: '+j.status+' (last update '+j.updated+')',true);
  }catch(e){msg('m2',e.message,false);}
}
</script></body></html>
